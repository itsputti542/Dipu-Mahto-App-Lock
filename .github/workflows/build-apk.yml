name: Build DIPU MAHTO APP LOCK APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dipu_Mahto_App_Lock_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o Dipu_Mahto_App_Lock_Android_Project.zip -d android-project

      - name: Build debug APK
        run: gradle -p android-project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DIPU-MAHTO-APP-LOCK-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
