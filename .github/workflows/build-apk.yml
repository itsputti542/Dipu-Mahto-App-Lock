
name: Build DIPU MAHTO APP LOCK APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find . -type f -path '*/app/build.gradle.kts' -print -quit | sed 's#/app/build.gradle.kts$##')

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found!"
            echo "Please check app/build.gradle.kts"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "APK_PATH=$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DIPU-MAHTO-APP-LOCK-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          
