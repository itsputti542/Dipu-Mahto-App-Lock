
name: Build DIPU MAHTO APP LOCK APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dipu_Mahto_App_Lock_Android_Project_v2.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o Dipu_Mahto_App_Lock_Android_Project_v2.zip -d android-project
          test -f android-project/app/build.gradle.kts

      - name: Build APK
        run: gradle -p android-project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DIPU-MAHTO-APP-LOCK-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
